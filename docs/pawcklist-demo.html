<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Pawcklist Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d120c;
        --surface: #1d241c;
        --surface-alt: #232a22;
        --text: #f4f0e1;
        --dim: rgba(244, 240, 225, 0.55);
        --border: rgba(168, 198, 134, 0.22);
        --accent: #a8c686;
        --amber: #f4c95d;
        --danger: #e79fb4;
        --sage: #a8c686;
        --sage-light: #bcd69c;
        --butter: #f4c95d;
        --cream: #fbf4e0;
        --cream-ink: #26331f;
        --ink-faint: rgba(244, 240, 225, 0.34);
        --card-edge: rgba(168, 198, 134, 0.22);
        --sheet-white: #faf4de;
        --sheet-green: #83b079;
        --font-sans: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      button { font-family: inherit; }
      p { margin: 0; }

      /* ---------- faint background shapes ---------- */
      .bg-decor { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
      .bg-decor svg { position: absolute; fill: var(--sage); }
      .bg-decor .s1 { width: 340px; height: 340px; top: -120px; right: -110px; opacity: 0.05; transform: rotate(18deg); }
      .bg-decor .s2 { width: 150px; height: 150px; bottom: 12%; left: -60px; opacity: 0.045; transform: rotate(-14deg); }
      .bg-decor .p1 { width: 170px; height: 170px; bottom: -40px; right: 6%; opacity: 0.05; transform: rotate(24deg); }
      .bg-decor .p2 { width: 92px; height: 92px; top: 44%; right: -24px; opacity: 0.04; transform: rotate(-30deg); }

      .page-wrap { position: relative; z-index: 1; max-width: 468px; margin: 0 auto; padding: 14px 10px 28px; }

      /* ---------- demo ribbon ---------- */
      .demo-ribbon {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        margin-bottom: 12px; padding: 8px 13px;
        background: rgba(244, 201, 93, 0.1); border: 1px dashed rgba(244, 201, 93, 0.45);
        border-radius: 14px; font-size: 12.5px; font-weight: 700; color: var(--butter);
      }
      .demo-ribbon a { color: var(--butter); font-weight: 800; white-space: nowrap; }

      /* ---------- hero ---------- */
      .hero {
        position: relative;
        border-radius: 26px;
        background: linear-gradient(160deg, #c0d69e 0%, var(--sage-light) 45%, var(--sage) 100%);
        color: var(--cream-ink);
        overflow: hidden;
        height: 168px;
      }
      .hero .star-deco { position: absolute; fill: #5d7d3e; opacity: 0.14; }
      .hero .star-deco.a { width: 110px; height: 110px; top: -34px; right: 30%; transform: rotate(12deg); }
      .hero .star-deco.b { width: 120px; height: 120px; bottom: -52px; right: -18px; transform: rotate(-10deg); }
      .hero .star-deco.c { width: 54px; height: 54px; top: 6px; right: 6px; transform: rotate(14deg); opacity: 0.1; }
      .hero-cat { position: absolute; left: 4px; bottom: 0; width: 41%; height: auto; z-index: 1; display: block; }
      .hero-main { position: relative; z-index: 2; margin-left: 44%; padding: 15px 16px 0 2px; height: 100%; min-width: 0; display: flex; flex-direction: column; }
      .hero-date { font-weight: 800; font-size: 14.5px; letter-spacing: 0.02em; color: #ffffff; text-shadow: 0 1px 2px rgba(38, 51, 31, 0.18); }
      .hero-day {
        font-family: "Baloo 2", "Nunito", sans-serif;
        font-weight: 800;
        line-height: 1.04;
        color: #10130e;
        letter-spacing: 0.005em;
        white-space: nowrap;
        max-width: 100%;
        overflow: hidden;
      }
      .progress-zone { position: relative; margin-top: auto; padding-bottom: 16px; }
      .progress-meta { display: flex; justify-content: flex-end; align-items: flex-end; min-height: 24px; margin-bottom: 3px; }
      .progress-pct { font-family: "Baloo 2", "Nunito", sans-serif; font-weight: 800; font-size: 21px; line-height: 1; color: #ffffff; text-shadow: 0 1px 2px rgba(38, 51, 31, 0.18); }
      .progress-track { position: relative; height: 12px; border-radius: 99px; background: #141614; }
      .progress-fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: #ffffff; transition: width 0.45s cubic-bezier(0.34, 1.3, 0.5, 1); }
      .bar-cat { position: absolute; left: 6px; bottom: -3px; width: 94px; z-index: 3; pointer-events: none; }
      .bar-cat svg { display: block; width: 100%; height: auto; overflow: visible; }
      .bar-cat .sleep-star { display: none; }
      .progress-zone.all-done .bar-cat .sleep-star { display: block; position: absolute; top: -10px; right: -6px; width: 18px; height: 18px; fill: var(--butter); animation: twinkle 1.6s ease-in-out infinite alternate; }
      @keyframes twinkle { from { transform: scale(0.85) rotate(-6deg); } to { transform: scale(1.1) rotate(8deg); } }

      /* ---------- mini calendar ---------- */
      .daystrip { position: relative; margin-top: 14px; background: #0a0c0a; border-radius: 24px; padding: 13px 34px 15px; }
      .week-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
      .week-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 30px; height: 54px; background: none; border: none; padding: 0; display: grid; place-items: center; transition: transform 0.12s; cursor: pointer; }
      .week-arrow:active { transform: translateY(-50%) scale(0.85); }
      .week-arrow svg { width: 17px; height: 23px; fill: var(--sage-light); display: block; }
      .week-arrow.prev { left: 4px; }
      .week-arrow.next { right: 4px; }
      .day-cell { background: none; border: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #ffffff; cursor: pointer; }
      .day-cell .dow { font-size: 14px; font-weight: 800; letter-spacing: 0.04em; color: #ffffff; }
      .day-cell .bubble { position: relative; width: 42px; height: 42px; display: grid; place-items: center; }
      .day-cell .num { position: relative; z-index: 1; font-weight: 800; font-size: 16.5px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #3c3c3c; color: #ffffff; transition: background 0.2s, color 0.2s; }
      .day-cell .cathead { display: none; }
      .day-cell.selected .num { background: transparent; color: #141a10; transform: translateY(2px); }
      .day-cell.selected .cathead { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 39px; height: 35.6px; fill: #bcd69c; }
      .day-cell.today:not(.selected) .num { background: var(--butter); color: #2c2410; }
      .back-today { display: block; margin: 6px auto 0; background: none; border: none; color: var(--sage); font-size: 13.5px; font-weight: 800; padding: 2px 10px; cursor: pointer; }

      /* ---------- section headers ---------- */
      .section-head { display: flex; align-items: center; justify-content: space-between; margin: 8px 2px 9px; }
      .section-title { font-family: "Baloo 2", "Nunito", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em; color: var(--text); }
      .head-actions { display: flex; gap: 7px; }
      .icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--card-edge); background: var(--surface); color: var(--sage); display: grid; place-items: center; transition: transform 0.15s; cursor: pointer; }
      .icon-btn:active { transform: scale(0.92); }
      .icon-btn svg { width: 17px; height: 17px; }
      .icon-btn.editing { background: var(--butter); border-color: var(--butter); color: #2c2410; }

      /* ---------- logs ---------- */
      .logs { display: flex; flex-wrap: wrap; gap: 7px; }
      .log-pill { display: inline-flex; align-items: center; gap: 7px; padding: 7px 14px; border-radius: 99px; border: 1px solid rgba(244, 240, 225, 0.13); background: rgba(35, 42, 34, 0.55); color: var(--ink-faint); font-size: 14.5px; font-weight: 700; cursor: pointer; transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.12s; }
      .log-pill:active { transform: scale(0.96); }
      .log-pill .paw-ic { width: 19px; height: 19px; fill: currentColor; display: none; flex: none; }
      .log-pill.on { background: var(--butter); border-color: var(--butter); color: #2c2410; }
      .log-pill.on .paw-ic { display: block; }
      .log-pill .log-remove { display: none; width: 17px; height: 17px; margin-left: 1px; place-items: center; flex: none; background: none; border: none; color: inherit; cursor: pointer; padding: 0; }
      .log-pill .log-remove svg { width: 12px; height: 12px; display: block; }
      .logs.editing .log-pill { color: var(--text); cursor: default; }
      .logs.editing .log-pill.on { color: #2c2410; }
      .logs.editing .log-remove { display: grid; }
      .log-pill.confirming { background: #a8324a; border-color: #a8324a; color: #fff; }
      .logs-add { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
      .logs-add-field { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--card-edge); border-radius: 99px; color: var(--text); font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 15px; outline: none; }
      .logs-add-field::placeholder { color: var(--ink-faint); }
      .logs-add-field:focus { border-color: var(--sage); box-shadow: 0 0 0 2px rgba(168, 198, 134, 0.25); }
      .logs-add-btn { flex: none; background: var(--sage); border: 1px solid var(--sage); color: var(--cream-ink); border-radius: 99px; font-size: 14px; font-weight: 800; padding: 9px 18px; cursor: pointer; transition: transform 0.12s; }
      .logs-add-btn:active { transform: scale(0.95); }
      .logs-add-btn:disabled { opacity: 0.5; }
      .logs-empty { font-size: 13.5px; color: var(--dim); font-weight: 600; }
      .logs-confirm-hint { margin-top: 6px; font-size: 12.5px; font-weight: 700; color: var(--danger); }

      /* ---------- tasks ---------- */
      .task { position: relative; display: flex; align-items: center; gap: 11px; background: rgba(29, 36, 28, 0.55); border: 1px solid var(--card-edge); border-radius: 16px; padding: 9px 10px 9px 11px; margin-bottom: 8px; }
      .paw-btn { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(244, 240, 225, 0.45); background: transparent; display: grid; place-items: center; cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s; padding: 0; }
      .paw-btn:active { transform: scale(0.9); }
      .paw-btn svg { width: 22px; height: 22px; fill: var(--cream-ink); opacity: 0; transform: scale(0.5); transition: opacity 0.18s, transform 0.22s cubic-bezier(0.34, 1.6, 0.6, 1); }
      .task.done .paw-btn { background: var(--sage); border-color: var(--sage); }
      .task.done .paw-btn svg { opacity: 1; transform: scale(1); }
      .task-body { flex: 1; min-width: 0; background: none; border: none; padding: 0; text-align: left; color: inherit; cursor: pointer; }
      .task-text { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.35; color: var(--text); overflow-wrap: break-word; }
      .task.done .task-text { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; text-decoration-color: rgba(244, 240, 225, 0.65); }
      .task-note-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 3px; }
      .task-tag { display: inline-flex; align-items: center; background: transparent; border: none; color: var(--butter); font-size: 12px; font-weight: 800; letter-spacing: 0.02em; line-height: 1.35; padding: 2px 2px 3px; white-space: nowrap; }
      .task.done .task-tag { opacity: 0.75; }
      .rolled-note { display: inline-flex; align-items: center; color: var(--dim); font-size: 12.5px; font-weight: 700; line-height: 1.35; white-space: normal; }
      .task.next-day { background: #151a14; border-color: rgba(168, 198, 134, 0.1); }
      .task.next-day .task-text { color: rgba(244, 240, 225, 0.36); }
      .task.next-day .task-tag { opacity: 0.55; }
      .task.next-day .rolled-note { color: rgba(244, 240, 225, 0.5); }
      .task.next-day .task-body { cursor: default; }
      .task.next-day .paw-btn { cursor: default; opacity: 0.5; background: transparent; border-color: rgba(244, 240, 225, 0.16); }
      .task.next-day .paw-btn:active { transform: none; }
      .task.next-day .paw-btn svg { opacity: 0; }
      .task.next-day .task-text { text-decoration: none; }
      .task-menu { flex: none; background: none; border: none; color: var(--dim); padding: 6px 4px; cursor: pointer; }
      .task-menu svg { width: 17px; height: 17px; display: block; }
      .task-pop { position: absolute; right: 6px; top: calc(100% - 8px); z-index: 30; display: flex; align-items: center; gap: 2px; background: var(--sheet-white); border: 1px solid var(--sheet-white); border-radius: 999px; padding: 5px 7px; box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45); transform-origin: calc(100% - 14px) 0; animation: popMenu 0.28s cubic-bezier(0.34, 1.5, 0.5, 1) both; }
      .task-pop::before { content: ""; position: absolute; top: -5px; right: 15px; width: 10px; height: 10px; background: var(--sheet-white); transform: rotate(45deg); border-radius: 2px; }
      .task-pop.out { animation: popMenuOut 0.16s ease-in both; }
      @keyframes popMenu { 0% { transform: scale(0.35); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes popMenuOut { from { transform: scale(1); opacity: 1; } to { transform: scale(0.35); opacity: 0; } }
      .task-pop .pop-ic { position: relative; z-index: 1; flex: none; width: 36px; height: 36px; display: grid; place-items: center; background: none; border: none; color: var(--cream-ink); padding: 0; border-radius: 50%; cursor: pointer; }
      .task-pop .pop-ic svg { width: 20px; height: 20px; display: block; }
      .task-pop .pop-ic:active { background: rgba(131, 176, 121, 0.45); }
      .task-pop .pop-ic.danger { color: #a8324a; }
      .task-pop .pop-ic.danger:active { background: rgba(168, 50, 74, 0.16); }
      .task-pop .pop-ic.confirming { width: auto; display: inline-flex; align-items: center; gap: 5px; padding: 0 11px; border-radius: 999px; background: #a8324a; color: #fff; font-size: 12px; font-weight: 800; white-space: nowrap; }
      .task-pop .pop-ic.confirming svg { width: 16px; height: 16px; }
      .task-pop .pop-ic.confirming:active { background: #a8324a; }
      .empty-card { background: var(--surface); border: 1px solid var(--card-edge); border-radius: 18px; padding: 26px 18px; text-align: center; margin-top: 14px; }
      .empty-card p:first-child { font-size: 16px; font-weight: 700; color: var(--text); }
      .empty-card p:last-child { font-size: 13.5px; color: var(--dim); margin-top: 4px; font-weight: 600; }
      .all-done-msg { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 700; color: var(--sage); }

      /* ---------- reminders card ---------- */
      .reminders { position: relative; background: var(--cream); color: var(--cream-ink); border-radius: 18px; padding: 13px 14px 22px; margin-top: 19px; overflow: hidden; }
      .reminders .corner-star { position: absolute; width: 56px; height: 56px; right: -17px; bottom: -18px; fill: var(--sage); opacity: 0.25; transform: rotate(16deg); }
      .reminders-head { display: flex; align-items: center; justify-content: space-between; }
      .reminders-title { font-family: "Baloo 2", "Nunito", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em; }
      .reminders .reminder-art-btn { width: 42px; height: 42px; background: none; border: none; border-radius: 50%; display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform 0.15s; }
      .reminders .reminder-art-btn:active { transform: scale(0.92); }
      .reminders .reminder-art-btn img { width: 40px; height: auto; display: block; }
      .reminder-item { display: flex; align-items: center; gap: 10px; margin-top: 10px; position: relative; z-index: 1; }
      .reminder-ic { flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(131, 176, 121, 0.35); display: grid; place-items: center; color: var(--cream-ink); }
      .reminder-ic.once { background: var(--butter); }
      .reminder-ic svg { width: 14px; height: 14px; }
      .reminder-text { font-size: 14.5px; font-weight: 700; flex: 1; min-width: 0; }
      .reminder-sent { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: #5d7d3e; }
      .reminders-empty { margin-top: 10px; font-size: 14px; font-weight: 600; color: rgba(38, 51, 31, 0.55); position: relative; z-index: 1; }

      /* ---------- pop-ups ---------- */
      .sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px 14px; }
      .sheet-backdrop { position: absolute; inset: 0; background: rgba(4, 7, 4, 0.62); animation: backdropIn 0.25s ease both; }
      .sheet-wrap.closing .sheet-backdrop { animation: backdropOut 0.22s ease both; }
      @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes backdropOut { from { opacity: 1; } to { opacity: 0; } }
      .sheet { position: relative; width: 100%; max-width: 440px; background: var(--sheet-white); color: var(--cream-ink); border: 1px solid var(--sheet-white); border-radius: 24px; padding: 14px; max-height: calc(100dvh - 40px); overflow-y: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); }
      .sheet.pop-in { animation: popIn 0.42s cubic-bezier(0.34, 1.45, 0.5, 1) both; }
      .sheet.pop-out { animation: popOut 0.22s ease-in both; }
      @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 55% { opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes popOut { from { transform: scale(1); opacity: 1; } to { transform: scale(0.5); opacity: 0; } }
      .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
      .sheet-title { font-family: "Baloo 2", "Nunito", sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.14em; display: flex; align-items: center; gap: 8px; }
      .sheet-actions { display: flex; gap: 7px; }
      .field { width: 100%; background: var(--sheet-green); border: 1px solid var(--sheet-green); border-radius: 12px; color: var(--cream-ink); font-family: inherit; font-size: 14px; font-weight: 600; padding: 9px 11px; outline: none; }
      .field:focus { box-shadow: 0 0 0 2px rgba(38, 51, 31, 0.3); }
      .field::placeholder { color: rgba(38, 51, 31, 0.45); }
      .task-tags-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
      .task-tags-row .tags-field { flex: 1; min-width: 0; width: auto; }
      .task-tags-row .send-btn { flex: none; }
      #sheetTaskForm .sheet-head { margin-bottom: 16px; }
      .new-task-art { height: 34px; width: auto; display: block; margin: -7px 0 -7px -3px; }
      .tag-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
      .tag-chip { gap: 5px; padding-right: 6px; }
      .tag-chip-x { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 50%; border: none; background: none; color: var(--butter); padding: 0; cursor: pointer; flex: none; }
      .tag-chip-x svg { width: 9px; height: 9px; display: block; }
      .seg { display: inline-flex; background: var(--sheet-green); border: 1px solid var(--sheet-green); border-radius: 99px; padding: 2px; flex: none; }
      .seg button { border: none; background: none; color: rgba(38, 51, 31, 0.6); font-size: 12.5px; font-weight: 800; font-family: inherit; padding: 6px 12px; border-radius: 99px; white-space: nowrap; cursor: pointer; }
      .seg button.on { background: var(--cream-ink); color: var(--sheet-green); }
      .seg.butter button.on { background: var(--butter); color: #2c2410; }
      .form-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .form-row .grow { flex: 1; min-width: 0; }
      select.field, input[type="date"].field { appearance: none; -webkit-appearance: none; padding: 8px 10px; font-size: 13px; color-scheme: light; }
      .send-btn { position: relative; display: inline-flex; align-items: center; gap: 6px; background: var(--cream-ink); color: var(--sheet-green); border: none; border-radius: 99px; font-size: 13px; font-weight: 800; font-family: inherit; padding: 9px 15px; flex: none; cursor: pointer; transition: background 0.2s, transform 0.15s; }
      .send-btn:active { transform: scale(0.94); }
      .send-btn:disabled { opacity: 0.5; }
      .send-btn svg { width: 14px; height: 14px; }
      .send-btn.sent { background: var(--butter); color: #2c2410; }
      .sent-pop { position: absolute; left: 50%; top: -6px; transform: translate(-50%, 0) scale(0.6); background: var(--butter); color: #2c2410; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 99px; display: inline-flex; align-items: center; gap: 4px; opacity: 0; pointer-events: none; white-space: nowrap; }
      .sent-pop svg { width: 11px; height: 11px; fill: #2c2410; }
      .sent-pop.play { animation: sentPop 1.3s ease forwards; }
      @keyframes sentPop { 0% { opacity: 0; transform: translate(-50%, 2px) scale(0.6); } 18% { opacity: 1; transform: translate(-50%, -10px) scale(1.05); } 30% { transform: translate(-50%, -13px) scale(1); } 75% { opacity: 1; transform: translate(-50%, -15px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -22px) scale(0.9); } }
      .rep-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 8px; }
      .rep-item { display: flex; align-items: center; gap: 9px; background: var(--sheet-green); border: 1px solid var(--sheet-green); border-radius: 12px; padding: 5px 10px 5px 12px; color: var(--cream-ink); }
      .rep-item .rep-ic { width: 14px; height: 14px; flex: none; color: var(--cream-ink); }
      .rep-text { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 700; overflow-wrap: break-word; }
      .rep-text.off { opacity: 0.55; }
      .rep-when { font-size: 11.5px; font-weight: 700; color: rgba(38, 51, 31, 0.5); white-space: nowrap; }
      .rep-del { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: none; color: rgba(38, 51, 31, 0.55); display: grid; place-items: center; cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 800; }
      .rep-del svg { width: 17px; height: 17px; }
      .rep-del.confirming { width: auto; padding: 0 9px; border-radius: 99px; background: #a8324a; color: #fff; }
      .switch { flex: none; width: 36px; height: 20px; border-radius: 99px; border: none; padding: 0; background: rgba(38, 51, 31, 0.28); position: relative; transition: background 0.2s; cursor: pointer; }
      .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--sheet-green); transition: left 0.2s, background 0.2s; }
      .switch.on { background: var(--cream-ink); }
      .switch.on::after { left: 19px; background: var(--sheet-white); }
      .sheet-divider { display: flex; align-items: center; gap: 8px; color: rgba(38, 51, 31, 0.55); font-size: 11px; font-weight: 800; letter-spacing: 0.12em; margin: 2px 0 4px; }
      .sheet-divider::after { content: ""; flex: 1; height: 1px; background: rgba(38, 51, 31, 0.18); }
      #sheetReminders .sheet { container-type: inline-size; }
      .sheet-fish { height: 46px; height: 11.8cqw; width: auto; margin: -21px 0 -2px -2px; margin: -5.5cqw 0 -0.5cqw -2px; }
      .x-btn { background: none; border: none; padding: 2px; line-height: 0; cursor: pointer; transition: transform 0.15s; }
      .x-btn:active { transform: scale(0.9); }
      .x-btn img { width: 23px; width: 6cqw; height: auto; display: block; }
      #sheetTaskForm .sheet { container-type: inline-size; }
      #sheetTaskForm .x-btn img { width: 6cqw; }
      .sheet-foot { position: relative; z-index: 0; margin-top: 8px; min-height: 44px; min-height: 11.5cqw; pointer-events: none; }
      .sheet-foot .send-btn { pointer-events: auto; }
      .peek-face { position: absolute; right: -14px; bottom: -14px; width: 158px; width: 41.5cqw; height: auto; display: block; }
      #sheetReminders .field { padding: 10px 11px; }

      /* ---------- footer ---------- */
      .demo-foot { margin-top: 22px; text-align: center; font-size: 12.5px; font-weight: 600; color: var(--dim); line-height: 1.6; }
      .demo-foot a { color: var(--sage); font-weight: 800; }
      .demo-foot button { background: none; border: none; color: var(--sage); font-weight: 800; font-size: 12.5px; cursor: pointer; padding: 0; text-decoration: underline; }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation: none !important; transition: none !important; }
      }
    </style>

    <script>
      "use strict";
      /* ================= date helpers ================= */
      var WEEKDAY_NAMES = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
      var WEEKDAY_PLURAL = ["Sundays","Mondays","Tuesdays","Wednesdays","Thursdays","Fridays","Saturdays"];
      var MONTH_SHORT = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      var DOW_LETTERS = ["S","M","T","W","T","F","S"];

      function toKey(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return y + "-" + m + "-" + day;
      }
      function todayKey() { return toKey(new Date()); }
      function parseKey(key) { return new Date(key + "T12:00:00"); }
      function shiftKey(key, days) {
        var d = parseKey(key);
        d.setDate(d.getDate() + days);
        return toKey(d);
      }
      function weekStartKey(key) {
        var d = parseKey(key);
        d.setDate(d.getDate() - d.getDay());
        return toKey(d);
      }
      function heroDateLabel(key) {
        var d = parseKey(key);
        return MONTH_SHORT[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
      }
      function weekdayName(key) { return WEEKDAY_NAMES[parseKey(key).getDay()]; }
      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function pawSvg(cls) {
        return '<svg class="' + (cls || "") + '" viewBox="0 0 24 24" aria-hidden="true"><use href="#paw" /></svg>';
      }
      function repeatIconSvg(cls) {
        return '<svg viewBox="0 0 24 24" class="' + cls + '" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66" /><path d="M20 3v4h-4" /></svg>';
      }
      function oneTimeIconSvg(cls) {
        return '<svg viewBox="0 0 24 24" class="' + cls + '" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4" /><circle cx="12" cy="15.5" r="1.7" fill="currentColor" stroke="none" /></svg>';
      }

      /* ================= demo data (in-memory only) ================= */
      var nextId = 1;
      function nid() { return nextId++; }

      var state = null;
      function seedState() {
        var t = todayKey();
        var yest = shiftKey(t, -1);
        var s = {
          selectedDate: t,
          tasks: [],        // {id,title,tags,day,originDay,done,doneDay}
          habits: [],       // {id,label}
          habitLogs: {},    // dateKey -> {habitId:true}
          templates: [],    // {id,title,kind,schedule,weekday,specificDate,notifySlot,active}
          managingLogs: false,
          confirmHabitId: null
        };
        ["Gym", "Cook", "Litter box", "Study"].forEach(function (label) {
          s.habits.push({ id: nid(), label: label });
        });
        s.templates.push({ id: nid(), title: "Take meds", kind: "repeat", schedule: "weekends", weekday: null, specificDate: null, notifySlot: "AM", active: true });
        s.templates.push({ id: nid(), title: "Pick up your HelloFresh order", kind: "repeat", schedule: "weekly", weekday: parseKey(t).getDay(), specificDate: null, notifySlot: "PM", active: true });
        s.templates.push({ id: nid(), title: "Feed the cats", kind: "once", schedule: null, weekday: null, specificDate: t, notifySlot: "AM", active: true });
        // One reminder on each of the next few days, so every day has one.
        s.templates.push({ id: nid(), title: "Doctor's appointment", kind: "once", schedule: null, weekday: null, specificDate: shiftKey(t, 1), notifySlot: "AM", active: true });
        s.templates.push({ id: nid(), title: "Talk to Alex about the weekend", kind: "once", schedule: null, weekday: null, specificDate: shiftKey(t, 2), notifySlot: "PM", active: true });
        s.templates.push({ id: nid(), title: "Pick up the prescription", kind: "once", schedule: null, weekday: null, specificDate: shiftKey(t, 3), notifySlot: "AM", active: true });

        function task(title, tags, day, originDay, done, doneDay) {
          s.tasks.push({ id: nid(), title: title, tags: tags, day: day, originDay: originDay, done: done, doneDay: doneDay });
        }
        // Yesterday: four tasks. Two were checked off that day; the other
        // two were left undone and rolled over to today.
        task("Email the team the schedule", [], yest, yest, true, yest);
        task("Finish the presentation slides", [], yest, yest, true, yest);
        // The two rolled-over tasks, live today: the first is checked off
        // today, so its copy on yesterday reads "Completed later"; the
        // second is still open, so its yesterday copy reads "Didn't get
        // done, rolled over to next day".
        task("Check in for the flight", ["trip"], yest, yest, true, t);
        task("Review the draft proposal", [], yest, yest, false, null);
        // Today's own three tasks — two checked off, one still open.
        // Together with the two rolled-over tasks, today shows five.
        task("Grocery run for the week", ["grocery"], t, t, true, t);
        task("Call the hotel about check-in", [], t, t, true, t);
        task("Tidy the desk", ["chores"], t, t, false, null);
        // The next few days stay light: a task or two of their own each.
        task("Prep for the morning call", [], shiftKey(t, 1), shiftKey(t, 1), true, shiftKey(t, 1));
        task("Buy cat treats", [], shiftKey(t, 1), shiftKey(t, 1), false, null);
        task("Plan the weekend trip route", ["trip"], shiftKey(t, 2), shiftKey(t, 2), true, shiftKey(t, 2));
        task("Call the dentist to reschedule", [], shiftKey(t, 3), shiftKey(t, 3), false, null);
        return s;
      }

      /* ================= day view logic (mirrors the app) ================= */
      // A next-day copy: the historical copy on the day the task was added,
      // once the task has moved on — rolled over, manually moved, or checked
      // off on a later day. Greyed out and not checkable from that day;
      // the ⋮ menu (edit / delete) is its only interactive part.
      function isNextDayCopy(task, viewDate) {
        if (viewDate !== task.originDay) return false;
        if (task.done && task.doneDay === task.originDay) return false;
        var today = todayKey();
        return (
          task.day > task.originDay ||
          task.originDay < today ||
          (task.done && task.doneDay !== null && task.doneDay > task.originDay)
        );
      }
      // Rows for a day: carried-over tasks first, then the day's own.
      function rowsFor(viewDate) {
        var carried = [], own = [];
        state.tasks.forEach(function (task) {
          if (isNextDayCopy(task, viewDate)) {
            own.push({ task: task, nextDay: true });
            return;
          }
          if (task.done) {
            if (task.doneDay === viewDate) {
              (task.originDay === viewDate ? own : carried).push({ task: task, nextDay: false });
            }
            return;
          }
          // Unchecked: lives on its scheduled day and rolls forward.
          if (task.day <= viewDate) {
            (task.originDay === viewDate ? own : carried).push({ task: task, nextDay: false });
          }
        });
        return carried.concat(own);
      }
      function remindersFor(viewDate) {
        var dow = parseKey(viewDate).getDay();
        return state.templates.filter(function (t) {
          if (!t.active) return false;
          if (t.kind === "once") return t.specificDate === viewDate;
          switch (t.schedule) {
            case "daily": return true;
            case "weekdays": return dow >= 1 && dow <= 5;
            case "weekends": return dow === 0 || dow === 6;
            case "weekly": return t.weekday === dow;
            default: return false;
          }
        });
      }
      function shortWhen(t) {
        var base;
        if (t.kind === "once") {
          base = t.specificDate ? heroDateLabel(t.specificDate) : "One-time";
        } else {
          switch (t.schedule) {
            case "daily": base = "Every day"; break;
            case "weekdays": base = "Weekdays"; break;
            case "weekends": base = "Sat & Sun"; break;
            case "weekly": base = WEEKDAY_PLURAL[t.weekday == null ? 1 : t.weekday]; break;
            default: base = t.schedule;
          }
        }
        return t.notifySlot ? base + " · " + t.notifySlot : base;
      }

      /* ================= rendering ================= */
      var $ = function (id) { return document.getElementById(id); };

      function render() {
        var D = state.selectedDate;
        var today = todayKey();
        var isToday = D === today;

        // hero
        $("heroDate").textContent = heroDateLabel(D);
        var dayName = weekdayName(D);
        var dayEl = $("heroDay");
        dayEl.textContent = dayName;
        dayEl.style.fontSize = (dayName.length > 8 ? 33 : dayName.length > 7 ? 38 : 44) + "px";

        var rows = rowsFor(D);
        var active = rows.filter(function (r) { return !r.nextDay; });
        var doneCount = active.filter(function (r) { return r.task.done; }).length;
        var total = active.length;
        var pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
        $("progressPct").textContent = pct + "%";
        $("progressFill").style.width = pct + "%";
        var track = $("progressTrack");
        track.setAttribute("aria-valuenow", pct);
        track.setAttribute("aria-label", doneCount + " of " + total + " done");
        $("progressZone").classList.toggle("all-done", total > 0 && doneCount === total);

        // week strip
        var start = weekStartKey(D);
        var html = "";
        for (var i = 0; i < 7; i++) {
          var key = shiftKey(start, i);
          var d = parseKey(key);
          var selected = key === D;
          var isTodayCell = key === today;
          html += '<button type="button" class="day-cell' + (selected ? " selected" : "") + (isTodayCell ? " today" : "") + '"' +
            ' aria-label="' + WEEKDAY_NAMES[d.getDay()] + " " + heroDateLabel(key) + (isTodayCell ? " (today)" : "") + '"' +
            ' aria-pressed="' + selected + '" data-date="' + key + '">' +
            '<span class="dow">' + DOW_LETTERS[i] + '</span>' +
            '<span class="bubble">' +
              '<svg class="cathead" viewBox="0 0 331 302" aria-hidden="true"><use href="#cathead" /></svg>' +
              '<span class="num">' + d.getDate() + '</span>' +
            '</span></button>';
        }
        $("weekDays").innerHTML = html;

        var back = $("backToday");
        if (!isToday) {
          back.style.display = "block";
          back.textContent = D < today ? "Back to today >>" : "<< Back to today";
        } else {
          back.style.display = "none";
        }

        renderLogs(D);
        renderTasks(rows, active);
        renderReminders(D);
      }

      function renderLogs(D) {
        var area = $("logsArea");
        var logs = state.habitLogs[D] || {};
        var managing = state.managingLogs;
        var btn = $("manageLogsBtn");
        btn.classList.toggle("editing", managing);
        btn.setAttribute("aria-expanded", managing);
        btn.setAttribute("aria-label", managing ? "Done managing log buttons" : "Manage log buttons");
        btn.innerHTML = managing
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 12.5l5 5 10-11" /></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9" /><circle cx="15" cy="7" r="2.2" /><circle cx="9" cy="17" r="2.2" /></svg>';

        if (state.habits.length === 0 && !managing) {
          area.innerHTML = '<p class="logs-empty">No buttons yet — tap the manage icon above to add one.</p>';
          return;
        }
        var html = '<div class="logs' + (managing ? " editing" : "") + '">';
        state.habits.forEach(function (h) {
          var on = !!logs[h.id];
          if (managing) {
            var confirming = state.confirmHabitId === h.id;
            html += '<span class="log-pill' + (on ? " on" : "") + (confirming ? " confirming" : "") + '">' + esc(h.label) +
              '<button type="button" class="log-remove" data-remove-habit="' + h.id + '" aria-label="' +
              (confirming ? "Confirm removing " : "Remove ") + esc(h.label) + ' button">' +
              (confirming
                ? '<span style="font-size:13px;font-weight:900">?</span>'
                : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>') +
              '</button></span>';
          } else {
            html += '<button type="button" class="log-pill' + (on ? " on" : "") + '" data-toggle-habit="' + h.id + '" aria-pressed="' + on + '">' +
              pawSvg("paw-ic") + esc(h.label) + '</button>';
          }
        });
        html += "</div>";
        if (managing && state.confirmHabitId !== null) {
          html += '<p class="logs-confirm-hint">Tap ? again to remove that button. Past days stay in your history.</p>';
        }
        if (managing) {
          html += '<form class="logs-add" id="logsAddForm">' +
            '<input class="logs-add-field" id="logsAddField" aria-label="Name for a new log button" placeholder="Add one, e.g. Read" maxlength="60" />' +
            '<button type="submit" class="logs-add-btn">Add</button></form>';
        }
        area.innerHTML = html;
        var form = $("logsAddForm");
        if (form) {
          form.addEventListener("submit", function (e) {
            e.preventDefault();
            var v = $("logsAddField").value.trim();
            if (!v) return;
            state.habits.push({ id: nid(), label: v });
            render();
          });
        }
      }

      function renderTasks(rows, active) {
        var area = $("tasksArea");
        if (rows.length === 0) {
          area.innerHTML = '<div class="empty-card"><p>Nothing on this day yet</p><p>Tap the + next to the settings icon above to add your first task.</p></div>';
          return;
        }
        var html = "";
        rows.forEach(function (r) {
          var task = r.task;
          var nextDay = r.nextDay;
          var locked = nextDay;
          var hasMeta = task.tags.length > 0 || nextDay;
          var rolledNote = "";
          if (nextDay) {
            rolledNote = (task.done && task.doneDay !== null && task.doneDay > task.originDay)
              ? "Completed later"
              : "Didn’t get done, rolled over to next day";
          }
          html += '<article class="task' + (task.done && !nextDay ? " done" : "") + (nextDay ? " next-day" : "") + '" data-task-row="' + task.id + '">' +
            '<button type="button" class="paw-btn" role="checkbox" aria-checked="' + task.done + '" aria-label="Mark &quot;' + esc(task.title) + '&quot; as ' + (task.done ? "not done" : "done") + '"' +
              (locked ? " disabled" : "") + ' data-toggle-task="' + task.id + '">' + pawSvg() + '</button>' +
            '<button type="button" class="task-body" aria-label="Toggle &quot;' + esc(task.title) + '&quot;"' + (locked ? " disabled" : "") + ' data-toggle-task="' + task.id + '">' +
              '<span class="task-text">' + esc(task.title) + '</span>' +
              (hasMeta
                ? '<span class="task-note-row">' +
                    task.tags.map(function (tag) { return '<span class="task-tag">' + esc(tag) + '</span>'; }).join("") +
                    (nextDay ? '<span class="rolled-note">' + esc(rolledNote) + '</span>' : "") +
                  '</span>'
                : "") +
            '</button>' +
            '<button type="button" class="task-menu" aria-label="More actions for &quot;' + esc(task.title) + '&quot;" aria-expanded="false" data-menu-task="' + task.id + '">' +
            '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.9" /><circle cx="12" cy="12" r="1.9" /><circle cx="12" cy="19" r="1.9" /></svg></button>' +
          '</article>';
        });
        if (active.length > 0 && active.every(function (r) { return r.task.done; })) {
          html += '<p class="all-done-msg">Everything on this day is checked off.</p>';
        }
        area.innerHTML = html;
      }

      function renderReminders(D) {
        var list = remindersFor(D);
        var area = $("remindersList");
        if (list.length === 0) {
          area.innerHTML = '<p class="reminders-empty">Nothing here for this day.</p>';
          return;
        }
        area.innerHTML = list.map(function (t) {
          var isOnce = t.kind === "once";
          var hint = isOnce ? (t.notifySlot === "PM" ? "4:30 PM" : "9:00 AM") : "";
          return '<div class="reminder-item">' +
            '<span class="reminder-ic' + (isOnce ? " once" : "") + '" aria-hidden="true">' + (isOnce ? oneTimeIconSvg("") : repeatIconSvg("")) + '</span>' +
            '<span class="reminder-text">' + esc(t.title) + '</span>' +
            (hint ? '<span class="reminder-sent">' + hint + '</span>' : "") +
          '</div>';
        }).join("");
      }

      /* ================= task actions ================= */
      function findTask(id) {
        for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
        return null;
      }
      function toggleTask(id) {
        var task = findTask(id);
        if (!task) return;
        var D = state.selectedDate;
        if (isNextDayCopy(task, D)) {
          // Origin-day copy of a rolled-over task: not checkable from
          // here at all — only its ⋮ menu (edit / delete) works.
          return;
        } else if (task.done) {
          task.done = false;
          task.doneDay = null;
        } else {
          task.done = true;
          task.doneDay = D;
        }
        closeTaskMenu();
        render();
      }
      function moveTaskToNextDay(id) {
        var task = findTask(id);
        if (!task) return;
        task.day = shiftKey(state.selectedDate, 1);
        closeTaskMenu();
        render();
      }
      function deleteTask(id) {
        state.tasks = state.tasks.filter(function (t) { return t.id !== id; });
        closeTaskMenu();
        render();
      }

      /* ================= task ⋮ menu ================= */
      var openMenuTaskId = null;
      var menuConfirmDelete = false;
      function closeTaskMenu() {
        openMenuTaskId = null;
        menuConfirmDelete = false;
        var pop = document.querySelector(".task-pop");
        if (pop) pop.remove();
        document.querySelectorAll(".task-menu").forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
      }
      function openTaskMenu(taskId, btn) {
        closeTaskMenu();
        openMenuTaskId = taskId;
        btn.setAttribute("aria-expanded", "true");
        var row = btn.closest(".task");
        var taskForMenu = findTask(taskId);
        var isOriginCopy = !!(taskForMenu && isNextDayCopy(taskForMenu, state.selectedDate));
        var pop = document.createElement("div");
        pop.className = "task-pop";
        pop.setAttribute("role", "menu");
        pop.innerHTML =
          (isOriginCopy ? "" :
            '<button type="button" class="pop-ic" data-act="move" aria-label="Move to next day" title="Move to next day">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4" /><circle cx="8.8" cy="15.3" r="1.4" fill="currentColor" stroke="none" /><circle cx="15.2" cy="15.3" r="1.4" fill="currentColor" stroke="none" /></svg></button>') +
          '<button type="button" class="pop-ic" data-act="edit" aria-label="Edit" title="Edit">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3Z" /><path d="M15 5l4 4" /></svg></button>' +
          '<button type="button" class="pop-ic danger" data-act="delete" aria-label="Delete" title="Delete">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6h17M8 6V4.2A1.2 1.2 0 0 1 9.2 3h5.6A1.2 1.2 0 0 1 16 4.2V6M19 6l-0.9 13.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 6" /><path d="M10 11v6M14 11v6" /></svg></button>';
        row.appendChild(pop);
        pop.addEventListener("click", function (e) {
          var b = e.target.closest("[data-act]");
          if (!b) return;
          var act = b.getAttribute("data-act");
          if (act === "move") moveTaskToNextDay(taskId);
          else if (act === "edit") { var t = findTask(taskId); closeTaskMenu(); if (t) openTaskForm(t, btn); }
          else if (act === "delete") {
            if (menuConfirmDelete) { deleteTask(taskId); }
            else {
              menuConfirmDelete = true;
              b.classList.add("confirming");
              b.setAttribute("aria-label", "Tap again to delete");
              b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6h17M8 6V4.2A1.2 1.2 0 0 1 9.2 3h5.6A1.2 1.2 0 0 1 16 4.2V6M19 6l-0.9 13.1A2 2 0 0 1 16.1 21H7.9a2 2 0 0 1-2-1.9L5 6" /><path d="M10 11v6M14 11v6" /></svg><span>Delete?</span>';
            }
          }
        });
      }
      document.addEventListener("pointerdown", function (e) {
        if (openMenuTaskId !== null) {
          var row = document.querySelector('[data-task-row="' + openMenuTaskId + '"]');
          if (row && !row.contains(e.target)) closeTaskMenu();
        }
      }, true);

      /* ================= pop-ups ================= */
      var popupState = { open: false, closing: false, trigger: null };
      function openPopup(id, label, innerHTML, triggerEl) {
        closePopup(true);
        popupState.open = true;
        popupState.trigger = triggerEl || null;
        var root = $("popupRoot");
        root.innerHTML =
          '<div class="sheet-wrap" id="' + id + '">' +
            '<div class="sheet-backdrop" data-close="1" aria-hidden="true"></div>' +
            '<section class="sheet pop-in" role="dialog" aria-modal="true" aria-label="' + esc(label) + '">' + innerHTML + '</section>' +
          '</div>';
        var sheet = root.querySelector(".sheet");
        if (triggerEl && sheet) {
          var sr = sheet.getBoundingClientRect();
          var tr = triggerEl.getBoundingClientRect();
          if (sr.width && sr.height) {
            var ox = Math.min(Math.max(tr.left + tr.width / 2 - sr.left, 0), sr.width);
            var oy = Math.min(Math.max(tr.top + tr.height / 2 - sr.top, 0), sr.height);
            sheet.style.transformOrigin = ox + "px " + oy + "px";
          }
        }
        root.querySelector("[data-close]").addEventListener("click", function () { closePopup(); });
      }
      function closePopup(immediate) {
        var root = $("popupRoot");
        var wrap = root.querySelector(".sheet-wrap");
        if (!wrap) { popupState.open = false; return; }
        if (immediate) { root.innerHTML = ""; popupState.open = false; return; }
        var sheet = wrap.querySelector(".sheet");
        wrap.classList.add("closing");
        sheet.classList.remove("pop-in");
        sheet.classList.add("pop-out");
        popupState.open = false;
        setTimeout(function () { root.innerHTML = ""; }, 225);
      }
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && popupState.open) closePopup();
      });

      /* ---------- task form pop-up ---------- */
      var formTags = [];

        var out = existing.slice();
        var tag = (raw || "").trim();
        if (tag && !out.some(function (t) { return t.toLowerCase() === tag.toLowerCase(); })) out.push(tag);
        return out;

            formTags = formTags.filter(function (t) { return t !== b.getAttribute("data-untag"); });

          $("remScheduleField").addEventListener("change", function (e) { remForm.schedule = e.target.value; syncRemForm(); });
          var wf = $("remWeekdayField");
          if (wf) wf.addEventListener("change", function (e) { remForm.weekday = Number(e.target.value); });
        } else {
          slot.innerHTML = '<input type="date" class="field grow" id="remDateField" aria-label="Date for the one-time reminder" value="' + state.selectedDate + '" />';
        }
        $("remSubmitIcon").innerHTML = isOnce
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:14px;height:14px"><path d="M21 3L10.2 13.8M21 3l-6.8 18-3.9-7.1L3 9.9 21 3Z" /></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" style="width:14px;height:14px"><path d="M12 5v14M5 12h14" /></svg>';
        $("remSubmitLabel").textContent = isOnce ? "Send" : "Add";
      }
      function renderRemLists() {
        var box = $("remLists");
        if (!box) return;
        // One-time reminders are not listed here — they are sent once and
        // live only on that day's REMINDERS card, not in the manager.
        var repeating = state.templates.filter(function (t) { return t.kind !== "once"; });
        function itemHtml(t) {
          var confirming = remForm.confirmDeleteId === t.id;
          return '<div class="rep-item">' +
            (t.kind === "once" ? oneTimeIconSvg("rep-ic") : repeatIconSvg("rep-ic")) +
            '<span class="rep-text' + (t.active ? "" : " off") + '">' + esc(t.title) + '</span>' +
            '<span class="rep-when">' + esc(shortWhen(t)) + '</span>' +
            '<button type="button" class="switch' + (t.active ? " on" : "") + '" role="switch" aria-checked="' + t.active + '" aria-label="' + esc(t.title) + ': ' + (t.active ? "on" : "off") + '" data-toggle-tpl="' + t.id + '"></button>' +
            '<button type="button" class="rep-del' + (confirming ? " confirming" : "") + '" aria-label="' + (confirming ? "Confirm deleting " : "Delete ") + esc(t.title) + '" data-del-tpl="' + t.id + '">' +
              (confirming ? "Delete?" : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>') +
            '</button></div>';
        }
        var html = "";
        if (repeating.length > 0) html += '<div class="rep-list">' + repeating.map(itemHtml).join("") + '</div>';
        box.innerHTML = html;
        box.querySelectorAll("[data-toggle-tpl]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-toggle-tpl"));
            state.templates.forEach(function (t) { if (t.id === id) t.active = !t.active; });
            renderRemLists();
            render();
          });
        });
        box.querySelectorAll("[data-del-tpl]").forEach(function (b) {
          b.addEventListener("click", function () {
            var id = Number(b.getAttribute("data-del-tpl"));
            if (remForm.confirmDeleteId === id) {
              remForm.confirmDeleteId = null;
              state.templates = state.templates.filter(function (t) { return t.id !== id; });
            } else {
              remForm.confirmDeleteId = id;
            }
            renderRemLists();
            render();
          });
        });
      }

      /* ================= wiring ================= */
      document.addEventListener("click", function (e) {
        var cell = e.target.closest("[data-date]");
        if (cell) { state.selectedDate = cell.getAttribute("data-date"); closeTaskMenu(); render(); return; }
        var tog = e.target.closest("[data-toggle-task]");
        if (tog && !tog.disabled) { toggleTask(Number(tog.getAttribute("data-toggle-task"))); return; }
        var menuBtn = e.target.closest("[data-menu-task]");
        if (menuBtn) {
          var id = Number(menuBtn.getAttribute("data-menu-task"));
          if (openMenuTaskId === id) closeTaskMenu(); else openTaskMenu(id, menuBtn);
          return;
        }
        var habitBtn = e.target.closest("[data-toggle-habit]");
        if (habitBtn) {
          var hid = Number(habitBtn.getAttribute("data-toggle-habit"));
          var D = state.selectedDate;
          if (!state.habitLogs[D]) state.habitLogs[D] = {};
          if (state.habitLogs[D][hid]) delete state.habitLogs[D][hid]; else state.habitLogs[D][hid] = true;
          render();
          return;
        }
        var remBtn = e.target.closest("[data-remove-habit]");
        if (remBtn) {
          var rid = Number(remBtn.getAttribute("data-remove-habit"));
          if (state.confirmHabitId === rid) {
            state.habits = state.habits.filter(function (h) { return h.id !== rid; });
            state.confirmHabitId = null;
          } else {
            state.confirmHabitId = rid;
          }
          render();
          return;
        }
      });
      $("arrowPrev").addEventListener("click", function () { state.selectedDate = shiftKey(state.selectedDate, -1); closeTaskMenu(); render(); });
      $("arrowNext").addEventListener("click", function () { state.selectedDate = shiftKey(state.selectedDate, 1); closeTaskMenu(); render(); });
      $("backToday").addEventListener("click", function () { state.selectedDate = todayKey(); closeTaskMenu(); render(); });
      $("addTaskBtn").addEventListener("click", function (e) { openTaskForm(null, e.currentTarget); });
      $("manageLogsBtn").addEventListener("click", function () {
        state.managingLogs = !state.managingLogs;
        state.confirmHabitId = null;
        render();
      });
      $("remindersBtn").addEventListener("click", function (e) { openReminders(e.currentTarget); });
      $("resetDemo").addEventListener("click", function () {
        closePopup(true);
        closeTaskMenu();
        state = seedState();
        render();
      });

      state = seedState();
      render();
    </script>
  </body>
</html>
